[project]
name = "paper-reader"
version = "0.1.0"
description = "论文阅读器：已读/未读管理 + LLM 生成含 Agent 思考的 summary"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.scripts]
paper = "paper_reader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_reader"]
